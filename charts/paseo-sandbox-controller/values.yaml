imageRepository: ghcr.io/lerenn/paseo-kubernetes-sandboxes
# Optional full image reference, for example to pin a digest.
image: ""
imagePullSecrets: []
# Secret (tls.crt, tls.key) serving HTTPS. Empty: the chart generates a private CA and a certificate for the Service
# and keeps them in "<release>-sandbox-controller-tls"; give the Paseo plugin that Secret's ca.crt as its CA file.
tlsSecretName: ""

# Map of profile names to image, worktree, optional repository, and administrator-owned pod configuration.
# Optional idleMinutes (default 120, 0 disables) deletes a sandbox with no running command for that long.
# A volume mapping has claimName, basePath (as seen by Paseo), and optional subPath.
# The reserved standard profile is the Paseo default when available.
# Docker support requires docker.enabled: true and docker.image on a separate profile.
profiles: {}

# Map of principal names to tokenSha256 and allowed profile names.
# Supply the digest of a randomly generated token and give the raw token to the Paseo daemon.
principals: {}

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

controller:
  enabled: true

# Install in a separate release with controller.enabled=false to run only the gateway.
gateway:
  enabled: false
  # Operator-managed Secret with tls.crt and tls.key for the gateway hostname.
  tlsSecretName: ""
  # Operator-managed Secret mounted at /credentials for backend token and CA files.
  credentialsSecretName: ""
  # Existing, dedicated PVC. Use ReadWriteOncePod and retain across deployment changes.
  stateClaimName: ""
  # backend ID -> {url: HTTPS origin, caFile: /credentials/<key> (optional)}
  backends: {}
  # public profile alias -> {backend: backend ID, profile: controller profile ID, privileged: boolean}
  profiles: {}
  # gateway principal -> {tokenSha256, profiles: [public aliases], backendTokenFiles: {backend ID: /credentials/<key>}}
  principals: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
