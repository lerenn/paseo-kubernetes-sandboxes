imageRepository: ghcr.io/lerenn/paseo-kubernetes-sandboxes
# Optional full image reference, for example to pin a digest.
image: ""
imagePullSecrets: []
# A complete installation has one Gateway release and one or more backend releases.
installation:
  role: gateway

# Use a dedicated private issuer restricted to this installation. Set issuerName on all releases
# for cert-manager-managed leaf certificates, or provide existing Secrets below.
internalTLS:
  issuerName: ""
  # Bootstrap the dedicated ClusterIssuer from the Gateway release. Keep this name stable.
  bootstrap: false
  clusterResourceNamespace: cert-manager

controller:
  # Existing serving TLS Secret (tls.crt, tls.key). Empty uses cert-manager.
  tlsSecretName: ""
  # Profile names map to the image, shared worktree, optional repository and pod configuration.
  profiles: null
  # Principal names map to the Gateway DNS SAN and a list of allowed profiles.
  principals: null
  # Omit to use the chart defaults (50m CPU, 64Mi memory request, 256Mi memory limit).
  resources: null
  gatewayClientCASecretName: ""
  # Temporary opt-in only for upgrading direct installations. Legacy token digests may then be supplied.
  allowDirectMigration: false
  # Retain the chart-generated serving Secret from a pre-Gateway installation during migration.
  retainLegacyServingTLS: false

gateway:
  # Operator-managed Secret with tls.crt and tls.key for the gateway hostname.
  tlsSecretName: ""
  # Existing client TLS Secret (tls.crt, tls.key, ca.crt); empty uses cert-manager.
  credentialsSecretName: ""
  # Optional Secret with extra serving CAs, mounted at /backend-trust.
  backendTrustSecretName: ""
  # DNS SAN on the dedicated client certificate. Set the same identity in backend principal grants.
  clientIdentity: ""
  # Existing, dedicated PVC. Use ReadWriteOncePod and retain across deployment changes.
  stateClaimName: ""
  # backend ID -> {url: HTTPS origin, caFile: /credentials/<key> (optional, defaults to /credentials/ca.crt)}
  # Optional clusterDisplayName on each backend labels authorized profiles in the Execution picker.
  backends: {}
  # public profile alias -> {backend: backend ID, profile: controller profile ID, privileged: boolean}
  profiles: {}
  # gateway principal -> {tokenSha256, profiles: [public aliases], backendPrincipals: {backend ID: controller principal name}}
  principals: {}
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
