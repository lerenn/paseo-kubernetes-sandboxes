{{- $name := printf "%s-sandbox-controller" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $tlsName := default (printf "%s-tls" $name) .Values.tlsSecretName }}
{{- if not .Values.tlsSecretName }}
{{- /* No Secret supplied: generate a private CA and a serving certificate once, and keep them across upgrades. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $tlsName }}
{{- $crt := "" }}{{- $key := "" }}{{- $ca := "" }}
{{- if $existing }}
{{- $crt = index $existing.data "tls.crt" }}{{- $key = index $existing.data "tls.key" }}{{- $ca = index $existing.data "ca.crt" }}
{{- else }}
{{- $authority := genCA (printf "%s-ca" $name) 3650 }}
{{- $hosts := list $name (printf "%s.%s" $name .Release.Namespace) (printf "%s.%s.svc" $name .Release.Namespace) (printf "%s.%s.svc.cluster.local" $name .Release.Namespace) }}
{{- $cert := genSignedCert $name nil $hosts 3650 $authority }}
{{- $crt = b64enc $cert.Cert }}{{- $key = b64enc $cert.Key }}{{- $ca = b64enc $authority.Cert }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $tlsName }}
data:
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
  ca.crt: {{ $ca }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  config.json: {{ dict "profiles" (required "Configure at least one sandbox profile." .Values.profiles) "principals" (required "Configure at least one controller principal." .Values.principals) | toJson | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/config: {{ list .Values.profiles .Values.principals | toJson | sha256sum | quote }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ default (printf "%s:v%s" .Values.imageRepository .Chart.AppVersion) .Values.image | quote }}
          env:
            - name: CONTROLLER_CONFIG
              value: /config/config.json
            - name: CONTROLLER_SERVICE
              value: {{ $name | quote }}
            - name: SANDBOX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            httpGet:
              scheme: HTTPS
              port: https
              path: /healthz
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: tls
          secret:
            secretName: {{ $tlsName }}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: https
      port: 443
      targetPort: https
