{{- if eq .Values.installation.role "backend" }}
{{- $name := printf "%s-sandbox-controller" .Release.Name | trunc 63 | trimSuffix "-" }}
{{- $managedTLS := printf "%s-mtls" $name | trunc 63 | trimSuffix "-" }}
{{- $controller := .Values.controller }}
{{- $servingSecret := coalesce $controller.tlsSecretName .Values.tlsSecretName }}
{{- $tlsName := default $managedTLS $servingSecret }}
{{- $profiles := .Values.profiles }}
{{- if kindIs "map" $controller.profiles }}
{{- $profiles = $controller.profiles }}
{{- end }}
{{- $principals := .Values.principals }}
{{- if kindIs "map" $controller.principals }}
{{- $principals = $controller.principals }}
{{- end }}
{{- $resources := dict "requests" (dict "cpu" "50m" "memory" "64Mi") "limits" (dict "memory" "256Mi") }}
{{- if kindIs "map" $controller.resources }}
{{- $resources = $controller.resources }}
{{- else if kindIs "map" .Values.resources }}
{{- $resources = .Values.resources }}
{{- end }}
{{- if .Values.controller.retainLegacyServingTLS }}
{{- $tlsName = printf "%s-tls" $name }}
{{- end }}
{{- if and $servingSecret .Values.controller.retainLegacyServingTLS }}
{{- fail "Use either controller.tlsSecretName or controller.retainLegacyServingTLS." }}
{{- end }}
{{- if .Values.controller.retainLegacyServingTLS }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $tlsName }}
{{- if not $existing }}
{{- fail "Legacy serving TLS requires a live Helm lookup of the existing Secret. For Argo use an existing externally managed TLS Secret." }}
{{- end }}
apiVersion: v1
kind: Secret
type: kubernetes.io/tls
metadata:
  name: {{ $tlsName }}
  annotations:
    helm.sh/resource-policy: keep
data: {{ $existing.data | toJson }}
---
{{- end }}
{{- $caSecret := .Values.controller.gatewayClientCASecretName }}
{{- if or (eq $tlsName $managedTLS) (not $caSecret) }}
{{- $caSecret = default $managedTLS $caSecret }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $name }}
spec:
  secretName: {{ $managedTLS }}
  issuerRef:
    name: {{ required "Set internalTLS.issuerName or supply both controller.tlsSecretName and controller.gatewayClientCASecretName." .Values.internalTLS.issuerName | quote }}
    kind: ClusterIssuer
  dnsNames:
    - {{ $name | quote }}
    - {{ printf "%s.%s" $name .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc" $name .Release.Namespace | quote }}
    - {{ printf "%s.%s.svc.cluster.local" $name .Release.Namespace | quote }}
  duration: 24h
  renewBefore: 8h
  usages: [digital signature, key encipherment, server auth]
  privateKey:
    rotationPolicy: Always
---
{{- end }}
{{- $config := dict "profiles" (required "Configure at least one sandbox profile." $profiles) "principals" (required "Configure at least one controller principal." $principals) "allowDirect" .Values.controller.allowDirectMigration | toJson }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "create", "delete"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["get", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  config.json: {{ $config | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/config: {{ $config | sha256sum | quote }}
    spec:
      serviceAccountName: {{ $name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: controller
          image: {{ default (printf "%s:v%s" .Values.imageRepository .Chart.AppVersion) .Values.image | quote }}
          env:
            - name: CONTROLLER_CONFIG
              value: /config/config.json
            - name: CONTROLLER_SERVICE
              value: {{ $name | quote }}
            - name: GATEWAY_CLIENT_CA_FILE
              value: /gateway-trust/ca.crt
            - name: SANDBOX_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: https
              containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: https
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            {{- toYaml $resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: gateway-trust
              mountPath: /gateway-trust
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: tls
          secret:
            secretName: {{ $tlsName | quote }}
        - name: gateway-trust
          secret:
            secretName: {{ $caSecret | quote }}
            items:
              - key: ca.crt
                path: ca.crt
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: https
      port: 443
      targetPort: https
{{- end }}
