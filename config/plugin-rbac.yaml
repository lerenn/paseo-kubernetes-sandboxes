# Bind this Role to the identity kubectl uses on the Paseo daemon host (user or ServiceAccount).
# Apply it in the sandbox namespace, for example:
#   kubectl create namespace paseo-sandboxes
#   kubectl apply -n paseo-sandboxes -f config/plugin-rbac.yaml
#   kubectl create rolebinding paseo-kubernetes-sandboxes -n paseo-sandboxes \
#     --role=paseo-kubernetes-sandboxes --user=<your-user>
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: paseo-kubernetes-sandboxes
  namespace: paseo-sandboxes
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch, create, delete]
  - apiGroups: ['']
    resources: [pods/exec]
    verbs: [create]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
  # Cluster tab checks the shared worktree claim; clone mode with a per-sandbox volume creates and
  # deletes its own claims (labelled managed-by=paseo-kubernetes-sandboxes).
  - apiGroups: ['']
    resources: [persistentvolumeclaims]
    verbs: [get, list, create, delete]
  # Git over SSH (optional): the plugin manages ONE Secret with this fixed name. `create` cannot be
  # restricted by name; the other verbs are. `get` is needed to compare the content hash annotation.
  # Whoever holds these rights on that Secret can read the key: grant them only to the daemon identity.
  - apiGroups: ['']
    resources: [secrets]
    verbs: [create]
  - apiGroups: ['']
    resources: [secrets]
    resourceNames: [paseo-sandbox-ssh]
    verbs: [get, update, patch, delete]
