# Example claim for worktree storage shared by the daemon and sandbox pods.
# Select a ReadWriteMany storage class for your cluster.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: paseo-worktrees
  namespace: paseo-sandboxes
spec:
  accessModes: [ReadWriteMany]
  resources:
    requests:
      storage: 20Gi
