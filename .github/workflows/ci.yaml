name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: plugin/package-lock.json}
      - run: npm ci && npm run typecheck && npm test
        working-directory: plugin
      - run: node .github/scripts/check-bundles.mjs && node .github/scripts/check-sidebar.mjs
  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run the manifest build step, as Paseo does on install
        working-directory: plugin
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("paseo-plugin.json", "utf8"));
            for (const f of [m.icon, "index.server.ts", "index.client.tsx"]) require("fs").accessSync(f);
            for (const cmd of m.build) require("child_process").execFileSync(cmd[0], cmd.slice(1), { stdio: "inherit" });
          '
      - name: Launcher is executable and valid JavaScript
        working-directory: plugin
        run: test -x launcher/sandbox-exec.mjs && node --check launcher/sandbox-exec.mjs
  plugin-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the plugin's dependencies (as the manifest build step does)
        working-directory: plugin
        run: npm ci --ignore-scripts && npm run build:launcher
      - name: Install Paseo's compiler, same version the plugin targets
        run: |
          v=$(node -p 'require("./plugin/package.json").devDependencies["@getpaseo/plugin"]')
          mkdir "$RUNNER_TEMP/paseo" && cd "$RUNNER_TEMP/paseo" && npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund "@getpaseo/server@$v"
          echo "PASEO_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the plugin with the real Paseo compiler (client and server bundles)
        run: node .github/scripts/build-plugin.mjs "$RUNNER_TEMP/paseo/node_modules" plugin "$PASEO_VERSION"
  # Keep this check name for the existing main-branch protection.
  rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: controller/package-lock.json}
      - run: npm ci --ignore-scripts && npm test && node --check server.mjs
        working-directory: controller
      - uses: azure/setup-helm@v4
      - run: |
          helm lint charts/paseo-sandbox-controller -f config/controller-values.example.yaml
          helm template sandbox charts/paseo-sandbox-controller -f config/controller-values.example.yaml
          helm template docker charts/paseo-sandbox-controller --namespace docker -f config/docker-values.example.yaml
          helm lint charts/paseo-sandbox-controller -f config/gateway-values.example.yaml
          helm template gateway charts/paseo-sandbox-controller -f config/gateway-values.example.yaml
          helm package charts/paseo-sandbox-controller --destination "$RUNNER_TEMP"
      - run: docker build -f controller/Dockerfile -t paseo-sandbox-controller:ci .
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Versions aligned (package.json, lock); a bump must exceed the latest tag
        run: node .github/scripts/check-version.mjs "${{ github.event.pull_request.base.sha || 'HEAD' }}"
