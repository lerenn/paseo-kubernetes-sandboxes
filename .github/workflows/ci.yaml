name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: plugin/package-lock.json}
      - run: npm ci && npm run typecheck && npm test
        working-directory: plugin
      - run: node .github/scripts/check-bundles.mjs && node .github/scripts/check-sidebar.mjs
  plugin-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Run the manifest build step, as Paseo does on install
        working-directory: plugin
        run: |
          node -e '
            const m = JSON.parse(require("fs").readFileSync("paseo-plugin.json", "utf8"));
            for (const f of [m.icon, "index.server.ts", "index.client.tsx"]) require("fs").accessSync(f);
            for (const cmd of m.build) require("child_process").execFileSync(cmd[0], cmd.slice(1), { stdio: "inherit" });
          '
      - name: Launcher is executable and valid JavaScript
        working-directory: plugin
        run: test -x launcher/sandbox-exec.mjs && node --check launcher/sandbox-exec.mjs
  plugin-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Install the plugin's dependencies (as the manifest build step does)
        working-directory: plugin
        run: npm ci --ignore-scripts && npm run build:launcher
      - name: Install Paseo's compiler, same version the plugin targets
        run: |
          v=$(node -p 'require("./plugin/package.json").devDependencies["@getpaseo/plugin"]')
          mkdir "$RUNNER_TEMP/paseo" && cd "$RUNNER_TEMP/paseo" && npm init -y >/dev/null
          npm i --no-save --no-audit --no-fund "@getpaseo/server@$v"
          echo "PASEO_VERSION=$v" >> "$GITHUB_ENV"
      - name: Build the plugin with the real Paseo compiler (client and server bundles)
        run: node .github/scripts/build-plugin.mjs "$RUNNER_TEMP/paseo/node_modules" plugin "$PASEO_VERSION"
  # Keep this check name for the existing main-branch protection.
  rbac:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: controller/package-lock.json}
      - run: npm ci --ignore-scripts && npm test && node --check server.mjs
        working-directory: controller
      - uses: azure/setup-helm@v4
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: false}
      - run: go install github.com/mikefarah/yq/v4@v4.49.1
      - run: |
          chart=charts/paseo-sandbox-controller
          values=config/installation-values.example.yaml
          for role in gateway standard docker; do
            scripts/helm-installation "$values" "$role" lint "$chart"
            scripts/helm-installation "$values" "$role" template "$role" "$chart" \
              --namespace "$role" > "$RUNNER_TEMP/$role-render.yaml"
          done
          grep -Eq 'kind: ClusterIssuer' "$RUNNER_TEMP/gateway-render.yaml"
          grep -Eq 'REPLACE_WITH_GATEWAY_TOKEN_SHA256' "$RUNNER_TEMP/gateway-render.yaml"
          grep -Eq 'ghcr.io/your-org/paseo-sandbox:stable' "$RUNNER_TEMP/standard-render.yaml"
          grep -Eq 'ghcr.io/your-org/paseo-sandbox-with-docker-cli:stable' "$RUNNER_TEMP/docker-render.yaml"
          for role in standard docker; do
            scripts/helm-installation "$values" "$role" > "$RUNNER_TEMP/$role-values.yaml"
            if grep -Eq 'REPLACE_WITH_GATEWAY_TOKEN_SHA256|sandbox-gateway-tls|^kind: ClusterIssuer' \
              "$RUNNER_TEMP/$role-values.yaml" "$RUNNER_TEMP/$role-render.yaml"; then
              exit 1
            fi
          done
          if grep -Eq 'paseo-sandbox-with-docker-cli' "$RUNNER_TEMP/standard-values.yaml" "$RUNNER_TEMP/standard-render.yaml" ||
             grep -Eq 'paseo-sandbox:stable' "$RUNNER_TEMP/docker-values.yaml" "$RUNNER_TEMP/docker-render.yaml"; then
            exit 1
          fi
          yq eval '.controller as $controller | .profiles = $controller.profiles |
            .principals = $controller.principals | del(.controller) |
            .tlsSecretName = "legacy-serving" | .resources.requests.cpu = "123m"' \
            "$RUNNER_TEMP/standard-values.yaml" > "$RUNNER_TEMP/legacy-values.yaml"
          helm template standard "$chart" -f "$RUNNER_TEMP/legacy-values.yaml" > "$RUNNER_TEMP/legacy-render.yaml"
          grep -Eq 'secretName: "legacy-serving"' "$RUNNER_TEMP/legacy-render.yaml"
          grep -Eq 'cpu: 123m' "$RUNNER_TEMP/legacy-render.yaml"
          helm template standard "$chart" -f "$RUNNER_TEMP/legacy-values.yaml" \
            --set controller.tlsSecretName=override-serving --set controller.resources.requests.cpu=234m > "$RUNNER_TEMP/override-render.yaml"
          grep -Eq 'secretName: "override-serving"' "$RUNNER_TEMP/override-render.yaml"
          grep -Eq 'cpu: 234m' "$RUNNER_TEMP/override-render.yaml"
          if grep -Eq 'secretName: "legacy-serving"|cpu: 123m' "$RUNNER_TEMP/override-render.yaml"; then
            exit 1
          fi
          bash .github/scripts/check-warm-pool.sh "$RUNNER_TEMP/standard-values.yaml"
          helm package charts/paseo-sandbox-controller --destination "$RUNNER_TEMP"
      - run: docker build -f controller/Dockerfile -t paseo-sandbox-controller:ci .
  docker-guest-admission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-go@v5
        with: {go-version: '1.25', cache: false}
      - run: go install sigs.k8s.io/kind@v0.31.0
      - name: Verify Docker guest admission on Kubernetes
        run: |
          kind create cluster --image kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a \
            --kubeconfig "$RUNNER_TEMP/docker-admission.kubeconfig" --wait 90s
          node examples/docker-guest/test.mjs "$RUNNER_TEMP/docker-admission.kubeconfig"
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Versions aligned (package.json, lock); a bump must exceed the latest tag
        run: node .github/scripts/check-version.mjs "${{ github.event.pull_request.base.sha || 'HEAD' }}"
