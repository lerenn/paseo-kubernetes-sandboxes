name: Auto-merge
# Opt-in: a PR by the repository owner labelled `automerge` is squash-merged by GitHub once the
# branch's required checks pass. Needs "Allow auto-merge" on in the repo settings.
# pull_request_target runs this file from the base branch and nothing from the PR is checked out
# or executed, so the elevated token is never exposed to PR code.
on:
  pull_request_target:
    types: [labeled, opened, reopened, synchronize, ready_for_review]
permissions:
  contents: write
  pull-requests: write
jobs:
  enable:
    if: >-
      github.event.pull_request.user.login == github.repository_owner &&
      contains(github.event.pull_request.labels.*.name, 'automerge') &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge (squash)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
