name: Release
on:
  push:
    branches: [main]
    paths: [plugin/package.json]
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - run: node .github/scripts/check-version.mjs
      - id: release
        uses: actions/github-script@v7
        with:
          script: |
            const { version } = require('./plugin/package.json');
            const tag = `v${version}`;
            core.setOutput('tag', tag);
            try {
              const { data } = await github.rest.repos.getReleaseByTag({ ...context.repo, tag });
              if (data.draft) core.setOutput('draft_id', data.id);
              core.setOutput('exists', String(!data.draft));
            } catch (error) {
              if (error.status !== 404) throw error;
              const draft = await github.paginate(github.rest.repos.listReleases, { ...context.repo })
                .then(releases => releases.find(release => release.draft && release.tag_name === tag));
              if (draft) core.setOutput('draft_id', draft.id);
              core.setOutput('exists', 'false');
            }
      - if: steps.release.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.release.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3
      - id: image
        if: steps.release.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: controller/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.release.outputs.tag }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - if: steps.release.outputs.exists == 'false'
        uses: azure/setup-helm@v4
      - id: chart
        if: steps.release.outputs.exists == 'false'
        name: Publish the Helm chart
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          printf '%s' "$GHCR_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          helm package charts/paseo-sandbox-controller --destination "$RUNNER_TEMP"
          output=$(helm push "$RUNNER_TEMP/paseo-sandbox-controller-${RELEASE_TAG#v}.tgz" "oci://$IMAGE/charts" 2>&1)
          printf '%s\n' "$output"
          digest=$(printf '%s\n' "$output" | sed -n 's/^Digest: //p')
          test -n "$digest"
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"
      - if: steps.release.outputs.exists == 'false'
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          DRAFT_ID: ${{ steps.release.outputs.draft_id }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CHART_DIGEST: ${{ steps.chart.outputs.digest }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const tag = process.env.RELEASE_TAG;
            const name = `paseo-sandbox-controller-${tag.slice(1)}.tgz`;
            const releaseId = process.env.DRAFT_ID ? Number(process.env.DRAFT_ID) :
              (await github.rest.repos.createRelease({
                ...context.repo, tag_name: tag, name: tag, target_commitish: context.sha,
                draft: true, generate_release_notes: true,
              })).data.id;
            const assets = await github.rest.repos.listReleaseAssets({ ...context.repo, release_id: releaseId });
            const existing = assets.data.find(asset => asset.name === name);
            if (existing) {
              await github.rest.repos.deleteReleaseAsset({ ...context.repo, asset_id: existing.id });
            }
            const data = fs.readFileSync(path.join(process.env.RUNNER_TEMP, name));
            await github.rest.repos.uploadReleaseAsset({
              ...context.repo, release_id: releaseId, name, data,
              headers: { 'content-type': 'application/gzip', 'content-length': data.length },
            });
            const { data: draft } = await github.rest.repos.getRelease({ ...context.repo, release_id: releaseId });
            const artifacts = `Image digest: ${process.env.IMAGE_DIGEST}\n\nOCI chart digest: ${process.env.CHART_DIGEST}`;
            await github.rest.repos.updateRelease({
              ...context.repo, release_id: releaseId, draft: false, body: [artifacts, draft.body].filter(Boolean).join('\n\n'),
            });
